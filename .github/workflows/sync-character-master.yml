name: Sync character master

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: character-master-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and generate master
        run: python scripts/sync_character_master.py
      - name: Fetch and generate aliases
        run: python scripts/sync_character_aliases.py
      - name: Commit only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/character_master.json scripts/character_master.py data/character_aliases.json
          if git diff --cached --quiet; then
            echo "キャラクターマスタに変更なし"
            exit 0
          fi
          git commit -m "chore: sync character master"
          git push
