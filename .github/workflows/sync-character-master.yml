name: Sync character master

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: character-master-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch and generate master
        run: python scripts/sync_character_master.py
      - name: Fetch and generate aliases
        run: python scripts/sync_character_aliases.py
      - name: Fetch and generate boss names
        run: python scripts/sync_boss_names.py
      - name: Reconcile browser and package data
        run: python scripts/reconcile_runtime_data.py
      - name: Verify synchronized data and formatter
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/character_master.json scripts/character_master.py data/character_aliases.json data/boss_names.json priconner_tl/data/
          if git diff --cached --quiet; then
            echo "キャラクターマスタに変更なし"
            exit 0
          fi
          git commit -m "chore: sync character master"
          git push
