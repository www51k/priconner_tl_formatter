name: Deploy priconner_tl_formatter

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync character master"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run tests and check JavaScript
        run: |
          python -m pip install pytest
          PYTHONPATH=scripts python -m pytest -q
          node --check app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p site-dist/scripts
          mkdir -p site-dist/data
          mkdir -p site-dist/priconner_tl
          cp index.html app.css app.js site-dist/
          cp data/character_master.json data/character_aliases.json data/boss_names.json site-dist/data/
          cp priconner_tl/__init__.py priconner_tl/character_aliases.py priconner_tl/character_master.py \
            priconner_tl/common.py priconner_tl/formatter.py priconner_tl/merge.py \
            priconner_tl/set_operations.py site-dist/priconner_tl/
          cp scripts/character_aliases.py scripts/character_master.py scripts/tl_common.py scripts/format_tl.py \
            scripts/add_set_operations.py scripts/validate_tl.py scripts/review_tl.py scripts/tl_merge.py site-dist/scripts/
          deploy_sha="$(git rev-parse HEAD)"
          sed -i "s/__DEPLOY_SHA__/${deploy_sha}/g" site-dist/index.html site-dist/app.js
          ! grep -q __DEPLOY_SHA__ site-dist/index.html site-dist/app.js

      - name: Smoke-test published Python modules
        run: PYTHONPATH=site-dist:site-dist/scripts python -c "from format_tl import format_text; from tl_merge import merge_texts; assert 'アオイ' in format_text('1:06 アオイ')"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
