name: Deploy priconner_tl_formatter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p site-dist/scripts
          mkdir -p site-dist/data
          cp index.html app.css app.js site-dist/
          cp data/character_master.json data/character_aliases.json data/boss_names.json site-dist/data/
          cp scripts/character_aliases.py scripts/character_master.py scripts/tl_common.py scripts/format_tl.py \
            scripts/add_set_operations.py scripts/validate_tl.py scripts/review_tl.py scripts/tl_merge.py site-dist/scripts/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
