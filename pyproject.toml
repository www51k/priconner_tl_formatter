[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "priconner-tl"
version = "0.1.0"
description = "Princess Connect TL formatting and SET operation utilities"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["priconner_tl"]

[tool.setuptools.package-data]
priconner_tl = ["data/*.json"]
